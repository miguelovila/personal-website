server {
  listen 80;
  server_name _;
  # Preserve the public scheme and port when a reverse proxy forwards requests.
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  # HTML and other stable URLs must revalidate after a deployment.
  add_header Cache-Control "no-cache";

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/rss+xml
    application/xml
    image/svg+xml
    text/css
    text/plain
    text/xml;

  location /_astro/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /pagefind/ {
    try_files $uri =404;
    # The entry metadata names hashed index files that change between builds.
    add_header Cache-Control "no-cache";
  }

  location /pt/ {
    error_page 404 /pt/404/index.html;
    try_files $uri $uri/ =404;
  }

  location / {
    error_page 404 /404.html;
    try_files $uri $uri/ =404;
  }
}
