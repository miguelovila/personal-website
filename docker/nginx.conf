server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/rss+xml
    application/xml
    image/svg+xml
    text/css
    text/plain
    text/xml;

  location /_astro/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /pagefind/ {
    try_files $uri =404;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  location /pt/ {
    error_page 404 /pt/404/index.html;
    try_files $uri $uri/ =404;
  }

  location / {
    error_page 404 /404.html;
    try_files $uri $uri/ =404;
  }
}
